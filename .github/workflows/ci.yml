name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  APP_URL: http://127.0.0.1:3457
  SESSION_SECRET: ci-session-secret-value-at-least-32-characters
  SESSION_COOKIE_NAME: curenear_session
  LOG_LEVEL: info
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: us-east-1
  S3_BUCKET: curenear-ci
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_FORCE_PATH_STYLE: 'true'
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: '1025'
  SMTP_FROM: no-reply@curenear.test
  SEED_ADMIN_EMAIL: admin@curenear.in
  SEED_ADMIN_NAME: Portal Admin
  SEED_ADMIN_PASSWORD: change-this-dev-password

jobs:
  quality:
    name: lint, typecheck, coverage, integration, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: curenear
          POSTGRES_PASSWORD: curenear
          POSTGRES_DB: curenear
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U curenear -d curenear"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://curenear:curenear@localhost:5432/curenear?schema=public
      TEST_DATABASE_URL: postgresql://curenear:curenear@localhost:5432/curenear?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @curenear/db generate

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate environment template
        run: pnpm check:env -- .env.example

      - name: Unit tests with coverage (shared gate 80%)
        run: pnpm test:coverage

      - name: Integration + OpenAPI contract + Testcontainers
        run: pnpm test:int

      - name: Build
        run: pnpm build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/shared/coverage
            apps/web/coverage
            packages/worker/coverage
          if-no-files-found: ignore

  containers:
    name: build production images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t curenear-web:ci .

      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t curenear-worker:ci .

  e2e:
    name: playwright critical journeys, exports and axe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: curenear
          POSTGRES_PASSWORD: curenear
          POSTGRES_DB: curenear
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U curenear -d curenear"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # The image creates MINIO_DEFAULT_BUCKETS at boot; the step below only
      # waits for the unauthenticated liveness endpoint.
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: curenear-ci
        ports:
          - 9000:9000

    env:
      DATABASE_URL: postgresql://curenear:curenear@localhost:5432/curenear?schema=public
      E2E_BASE_URL: http://127.0.0.1:3457
      E2E_NO_SERVER: '1'
      E2E_EXPECT_READY: '1'
      E2E_EXPORTS: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @curenear/db generate

      - run: pnpm db:migrate && pnpm db:seed

      - run: pnpm --filter @curenear/web exec playwright install --with-deps chromium

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "MinIO did not answer /minio/health/live"
          exit 1

      - name: Start web app
        run: pnpm --filter @curenear/web exec next dev -p 3457 -H 127.0.0.1 > /tmp/web.log 2>&1 &

      - name: Start export worker
        run: pnpm --filter @curenear/worker start > /tmp/worker.log 2>&1 &

      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3457/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/web.log
          exit 1

      - name: Run Playwright (critical journeys, export download, axe)
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

      - name: Server logs on failure
        if: failure()
        run: |
          echo "--- web ---"; tail -200 /tmp/web.log || true
          echo "--- worker ---"; tail -200 /tmp/worker.log || true

  performance:
    name: 100k provider load test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: quality
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: curenear
          POSTGRES_PASSWORD: curenear
          POSTGRES_DB: curenear
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U curenear -d curenear"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://curenear:curenear@localhost:5432/curenear?schema=public
      LOAD_BASE_URL: http://127.0.0.1:3457
      LOAD_EMAIL: admin@curenear.in
      LOAD_PASSWORD: change-this-dev-password
      LOAD_CONNECTIONS: '10'
      LOAD_DURATION: '10'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @curenear/db generate
      - run: pnpm db:migrate && pnpm db:seed

      - name: Seed 100,000 synthetic providers
        run: pnpm perf:seed

      - name: Start web app
        run: pnpm --filter @curenear/web exec next dev -p 3457 -H 127.0.0.1 > /tmp/web.log 2>&1 &

      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3457/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/web.log
          exit 1

      - name: Run autocannon load test
        run: pnpm perf:load

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: docs/performance.md
          if-no-files-found: ignore
