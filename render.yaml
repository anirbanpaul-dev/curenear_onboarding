# Render Blueprint. Region and plan values are placeholders: confirm them in the
# Render dashboard against current pricing and availability before applying.
#
# Secrets use `sync: false`: Render prompts for them on first apply and stores
# them; they are never committed. The all-on-Render web service is included.
databases:
  - name: curenear-db
    databaseName: curenear
    user: curenear
    # Free for a trial only; replace with a paid Render database plan before production.
    plan: free
    region: oregon
    postgresMajorVersion: '16'

envVarGroups:
  - name: curenear-secrets
    envVars:
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'false'
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: AGGREGATOR_WEBHOOK_URL
        sync: false
      - key: AGGREGATOR_WEBHOOK_TOKEN
        sync: false

services:
  - type: web
    name: curenear-web
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # Production releases are promoted after migrations; enable autoDeploy for staging only.
    autoDeploy: false
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @curenear/db generate && pnpm --filter @curenear/web build
    startCommand: pnpm --filter @curenear/web start
    healthCheckPath: /api/ready
    preDeployCommand: pnpm db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: SESSION_COOKIE_NAME
        value: curenear_session
      - key: DATABASE_URL
        fromDatabase:
          name: curenear-db
          property: connectionString
      - fromGroup: curenear-secrets

  - type: worker
    name: curenear-worker
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: false
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @curenear/db generate
    startCommand: pnpm --filter @curenear/worker start
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: curenear-db
          property: connectionString
      - fromGroup: curenear-secrets

# Render's current Blueprint schema, supported regions and which service types
# accept preDeployCommand must be checked against
# https://render.com/docs/blueprint-spec before applying.
